<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1410">
<title>HOLLOWAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1410; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #boot { position: fixed; left: 12px; bottom: 10px; color: #cfc6b0; font: 12px monospace; opacity: .8; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="boot">booting…</div>
<script>
  window.addEventListener('error', e => { const b = document.getElementById('boot'); if (b) { b.textContent = 'ERROR: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno; b.style.color = '#ff7a6b'; } });
  setTimeout(() => { const b = document.getElementById('boot'); if (b && !window.HW) { b.textContent = 'still booting after 8s — check console'; } }, 8000);
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
